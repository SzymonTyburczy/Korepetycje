<!DOCTYPE html>
<html lang="pl">

<head>
	<link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Panel — Korepetycje Szymon Tyburczy</title>
	<meta name="robots" content="noindex, nofollow" />
	<link rel="stylesheet" href="style.css" />
	<link rel="stylesheet" href="dashboard.css" />
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.min.js" integrity="sha384-BmlQlKlDvXvKoxkn5OQuUo/aJQCTXeB+Kls6EccBmG4Kf8AXvp89RtO9MtPxP/r5" crossorigin="anonymous"></script>
</head>

<body>
	<!-- TOP NAV -->
	<nav class="dash-nav" aria-label="Nawigacja panelu">
		<a class="dash-logo" href="/"><span>Korepetycje</span> Szymon Tyburczy</a>
		<div class="user-chip">
			<div class="user-avatar" id="userAvatar">?</div>
			<div class="user-name" id="userName">Ładowanie…</div>
			<div class="role-badge" id="userRole">—</div>
		</div>
		<button type="button" class="btn-signout" onclick="signOut()">Wyloguj</button>
	</nav>

	<!-- BOTTOM NAV (mobile) -->
	<nav class="bottom-nav" id="bottomNav" aria-label="Nawigacja mobilna"></nav>

	<div class="dash-layout">
		<!-- SIDEBAR (desktop) -->
		<aside class="dash-sidebar" id="dashSidebar"></aside>
		<div class="mobile-panel-switch">
			<div class="mobile-dashboard-actions">
				<a href="index.html">Strona</a>
				<button type="button" onclick="signOut()">Wyloguj</button>
			</div>
			<select id="mobilePanelSelect" aria-label="Wybierz widok panelu"></select>
		</div>
		<!-- MAIN -->
		<main class="dash-main" id="dashMain">
			<div class="loading">
				<div class="spinner"></div>
				Ładowanie…
			</div>
		</main>
	</div>

	<script src="supabase-config.js?v=20260716-2"></script>
	<script src="dashboard.js?v=20260716-2"></script>
</body>

</html>
