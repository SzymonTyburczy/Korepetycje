name: CI

on:
  push:
    branches: [try]
  pull_request:
    branches: [try]

jobs:
  checks:
    name: Kontrola projektu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Składnia JavaScript
        run: |
          for f in *.js scripts/*.js; do
            node --check "$f"
          done

      - name: Kontrola projektu (SRI, migracje, edge function)
        run: npm run check

      - name: Walidacja HTML
        run: npx --yes html-validate@8 *.html
