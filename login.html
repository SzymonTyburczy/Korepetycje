<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logowanie — Korepetycje Kowalski</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--navy); min-height: 100vh; display: flex; flex-direction: column; }

    .login-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-wrap {
      width: 100%;
      max-width: 480px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .login-logo a {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 700;
    }
    .login-logo a span { color: var(--white); }

    .login-card {
      background: var(--white);
      border-radius: 6px;
      padding: 2.5rem;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    /* TABS */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      background: var(--cream);
      border-radius: 4px;
      padding: 4px;
      margin-bottom: 2rem;
    }
    .auth-tab {
      padding: .6rem;
      text-align: center;
      border: none;
      background: none;
      border-radius: 3px;
      font-family: 'Source Serif 4', serif;
      font-size: .9rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all .2s;
    }
    .auth-tab.active {
      background: var(--white);
      color: var(--navy);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    /* PANELS */
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .auth-panel h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--navy);
      margin-bottom: .4rem;
    }
    .auth-panel p {
      font-size: .9rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
    }

    /* FORM */
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: .35rem; }
    .form-group label {
      font-size: .76rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--navy);
      font-weight: 600;
    }
    .form-group input {
      padding: .75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      font-family: 'Source Serif 4', serif;
      font-size: 16px;
      color: var(--text);
      background: var(--cream);
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--navy); background: var(--white); }

    .auth-submit {
      background: var(--navy);
      color: var(--white);
      border: none;
      padding: .9rem;
      border-radius: 3px;
      font-family: 'Source Serif 4', serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: .5rem;
    }
    .auth-submit:hover { background: var(--navy-light); }

    .auth-divider {
      text-align: center;
      color: var(--text-muted);
      font-size: .82rem;
      margin: 1rem 0;
      position: relative;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: var(--border);
    }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }

    .btn-google {
      width: 100%;
      padding: .8rem;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      background: var(--white);
      font-family: 'Source Serif 4', serif;
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      transition: border-color .2s, background .2s;
      color: var(--text);
    }
    .btn-google:hover { border-color: var(--navy); background: var(--cream); }

    .auth-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 3px;
      padding: .75rem 1rem;
      color: #dc2626;
      font-size: .88rem;
      display: none;
    }
    .auth-success {
      background: #f0faf4;
      border: 1px solid #86c9a2;
      border-radius: 3px;
      padding: .75rem 1rem;
      color: #256541;
      font-size: .88rem;
      display: none;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .88rem;
      color: rgba(255,255,255,.5);
    }
    .back-link a { color: var(--gold-light); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }

    /* Forgot password */
    .forgot-link {
      text-align: right;
      font-size: .8rem;
    }
    .forgot-link a { color: var(--gold); text-decoration: none; }
    .forgot-link a:hover { text-decoration: underline; }
  </style>

</head>
<body>
<div class="login-page">
  <div class="login-wrap">
    <div class="login-logo">
      <a href="index.html"><span>Korepetycje</span> Kowalski</a>
    </div>

    <div class="login-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Zaloguj się</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Zarejestruj się</button>
      </div>

      <!-- LOGIN -->
      <div class="auth-panel active" id="panelLogin">
        <h2>Witaj z powrotem</h2>
        <p>Zaloguj się, aby zobaczyć swoje lekcje i materiały.</p>
        <div class="auth-error" id="loginError"></div>
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label>Adres e-mail</label>
            <input type="email" id="loginEmail" placeholder="twoj@email.com" required />
          </div>
          <div class="form-group">
            <label>Hasło</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required />
          </div>
          <div class="forgot-link"><a href="#" onclick="showForgot()">Zapomniałeś hasła?</a></div>
          <button type="submit" class="auth-submit" id="loginBtn">Zaloguj się →</button>
        </form>
        <div class="auth-divider">lub</div>
        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Kontynuuj przez Google
        </button>
      </div>

      <!-- REGISTER -->
      <div class="auth-panel" id="panelRegister">
        <h2>Utwórz konto</h2>
        <p>Zarejestruj się, aby umówić lekcje i śledzić postępy.</p>
        <div class="auth-error" id="registerError"></div>
        <div class="auth-success" id="registerSuccess"></div>
        <form class="auth-form" id="registerForm">
          <div class="form-group">
            <label>Imię i nazwisko</label>
            <input type="text" id="regName" placeholder="Anna Nowak" required />
          </div>
          <div class="form-group">
            <label>Adres e-mail</label>
            <input type="email" id="regEmail" placeholder="twoj@email.com" required />
          </div>
          <div class="form-group">
            <label>Hasło (min. 8 znaków)</label>
            <input type="password" id="regPassword" placeholder="••••••••" minlength="8" required />
          </div>
          <button type="submit" class="auth-submit" id="registerBtn">Zarejestruj się →</button>
        </form>
        <div class="auth-divider">lub</div>
        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Kontynuuj przez Google
        </button>
      </div>
    </div>

    <div class="back-link">
      <a href="index.html">← Wróć na stronę główną</a>
    </div>
  </div>
</div>


<script>
  // Init
  initSupabase().then(async () => {
    // Jeśli już zalogowany → przekieruj do dashboardu
    const user = await getCurrentUser();
    if (user) window.location.href = 'dashboard.html';
  });

  function switchTab(tab) {
    document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
    document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  }

  // LOGIN
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    btn.textContent = 'Logowanie…'; btn.disabled = true; errEl.style.display = 'none';

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value,
    });

    if (error) {
      errEl.textContent = 'Błędny email lub hasło. Spróbuj ponownie.';
      errEl.style.display = 'block';
      btn.textContent = 'Zaloguj się →'; btn.disabled = false;
    } else {
      window.location.href = 'dashboard.html';
    }
  });

  // REGISTER
  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const errEl = document.getElementById('registerError');
    const sucEl = document.getElementById('registerSuccess');
    btn.textContent = 'Rejestracja…'; btn.disabled = true;
    errEl.style.display = 'none'; sucEl.style.display = 'none';

    const { error } = await supabaseClient.auth.signUp({
      email: document.getElementById('regEmail').value,
      password: document.getElementById('regPassword').value,
      options: { data: { full_name: document.getElementById('regName').value } }
    });

    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      btn.textContent = 'Zarejestruj się →'; btn.disabled = false;
    } else {
      sucEl.textContent = '✅ Sprawdź skrzynkę e-mail i potwierdź rejestrację!';
      sucEl.style.display = 'block';
      btn.textContent = 'Wysłano e-mail ✓';
    }
  });

  // GOOGLE
  async function loginWithGoogle() {
    await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/dashboard.html' }
    });
  }

  // FORGOT PASSWORD
  function showForgot() {
    const email = prompt('Podaj swój adres e-mail:');
    if (!email) return;
    supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/login.html'
    }).then(({ error }) => {
      if (!error) alert('✅ Link do resetowania hasła został wysłany na ' + email);
      else alert('Błąd: ' + error.message);
    });
  }
</script>
</body>
</html>
